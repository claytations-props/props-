<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Prop Rentals</title>
  <!-- Pulls in Tailwind CSS without needing to install anything -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 p-8">

  <header class="max-w-4xl mx-auto mb-12 text-center">
    <h1 class="text-4xl font-bold mb-4">Custom Theatrical Prop Rentals</h1>
    <p class="text-lg text-gray-600">Available for lease to regional theaters.</p>
  </header>

  <!-- The Prop Grid -->
  <main class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
    
    <!-- Prop Item 1 -->
    <article class="bg-white rounded-lg shadow overflow-hidden">
      <img src="prop-1.jpg" alt="Description of prop" class="w-full h-48 object-cover">
      <div class="p-6">
        <h2 class="text-xl font-bold mb-2">Vintage Railroad Lantern</h2>
        <p class="text-gray-600 mb-4">Modified for stage lighting. Battery operated.</p>
        <a href="mailto:your-email@example.com?subject=Rental Inquiry: Railroad Lantern" class="block w-full text-center bg-blue-600 text-white py-2 rounded hover:bg-blue-700">
          Inquire to Rent
        </a>
      </div>
    </article>

    <!-- Prop Item 2 -->
    <!-- Just copy and paste the <article> block for the next prop! -->

  </main>
</body>
</html>
